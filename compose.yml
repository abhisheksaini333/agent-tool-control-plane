services:
  postgres:
    image: postgres:13.5-alpine
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keel-local-only}
      POSTGRES_DB: keel
    ports: ["127.0.0.1:56484:5432"]
    volumes: ["keel-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  redis:
    image: redis:7.0.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6394:6379"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:18.0.2
    platform: linux/amd64
    command: ["start-dev", "--import-realm", "--hostname-strict=false"]
    environment:
      KEYCLOAK_ADMIN: local-admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keel-local-admin}
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    ports: ["127.0.0.1:8294:8080"]
    volumes:
      - ./infra/keel-realm.json:/opt/keycloak/data/import/keel-realm.json:ro
      - keel-identity:/opt/keycloak/data
    mem_limit: 768m
volumes:
  keel-identity:
  keel-data:
