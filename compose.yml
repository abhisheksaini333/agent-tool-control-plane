services:
  postgres:
    image: postgres:13.5-alpine
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keel-local-only}
      POSTGRES_DB: keel
    ports: ["127.0.0.1:56484:5432"]
    volumes: ["keel-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
volumes:
  keel-data:
